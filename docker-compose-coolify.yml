version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: telegram-multi-instance-manager-db
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram_multi_instance_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data

  telegram-multi-instance-manager:
    image: armandocastro/telegram-multi-instance-manager:latest
    container_name: telegram-multi-instance-manager
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - SERVICE_URL_MTG_3000
      - PUBLIC_URL=$SERVICE_URL_MTG
      # Use the db service name to connect from the Node.js container
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/telegram_multi_instance_manager?schema=public&connection_limit=500&pool_timeout=30
      - ACCESS_TOKEN=change_me_to_a_strong_secret
      - TELEGRAM_API_ID=
      - TELEGRAM_API_HASH=
      - API_LOGS_RETENTION_DAYS=30
      - WEBHOOK_LOGS_RETENTION_DAYS=30

      - WORKER_POOL_SIZE=6
      - WORKER_JOB_TIMEOUT_MS=30000
      - SIMULATION_MAX_MS=15000
      - INSTANCE_CACHE_TTL_MS=60000

volumes:
  postgres_data:
